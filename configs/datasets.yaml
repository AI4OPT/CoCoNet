# The 31 datasets of the paper: 25 multivariate (main table) and 6 univariate (appendix).
#
# Per dataset: `paper_name` (the row label in the paper), `output_dim`, `max_rows` (the row cap
# used for the paper's numbers: a seeded random sample of that many rows, or null for the whole
# dataset), `loader` (a key of coconet/data/loaders.py:LOADERS) and the loader's own fields.
# Raw files live under data/raw/; a missing UCI/OpenML file is downloaded on first use.

# ---------------------------------------------------------------- multivariate, d = 2
argoverse2_d2:
  paper_name: "Argoverse2-2D"
  output_dim: 2
  max_rows: 20000
  loader: argoverse2
  data_path: data/raw/argoverse2_multidim.csv
  target_columns: [future_dx_s60, future_dy_s60]
  drop_columns: [scenario_id]
  categorical_columns: [object_type, city]

argoverse2_motion_forecasting:
  paper_name: "Argoverse2 Motion"
  output_dim: 2
  max_rows: 20000
  loader: argoverse2
  data_path: data/raw/argoverse2_motion_forecasting.csv
  target_columns: [future_dx, future_dy]
  drop_columns: [scenario_id]
  categorical_columns: [object_type, city]

bias_correction_temperature:
  paper_name: "Bias-Corr. Temp."
  output_dim: 2
  max_rows: null
  loader: bias_correction_temperature
  url: "https://archive.ics.uci.edu/static/public/514/bias+correction+of+numerical+prediction+model+temperature+forecast.zip"
  raw_filename: bias_correction.zip
  zip_inner_file: Bias_correction_ucl.csv
  target_columns: [Next_Tmax, Next_Tmin]
  drop_columns: []
  categorical_columns: [station]
  date_column: Date

enb:
  paper_name: "ENB"
  output_dim: 2
  max_rows: null
  loader: openml_multi_target
  openml_data_id: 41478
  target_columns: [Y1, Y2]
