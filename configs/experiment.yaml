# Every setting of the experiments. Changing any value changes the numbers.

alpha: 0.10                     # target coverage 1 - alpha
seeds: [0, 1, 2, 3, 4]
row_sample_seed: 20260819       # row cap sample: seed = row_sample_seed + seed

split:                          # D_pred / D_score / D_cal / D_test (test = the remainder)
  pred: 0.25
  score: 0.30
  cal: 0.25
  pred_val: 0.15                # validation part of D_pred (point predictor early stopping)
  score_val: 0.20               # validation part of D_score (learned scores, MVCS, copula)

# Point predictor F(x): one ReLU MLP per (dataset, seed), MSE loss, Adam, fitted on the CPU with
# 4 threads and shared by every method. LW-SC fits its spread model with the same settings.
point_predictor:
  hidden_dims: [64, 32]
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 200
  patience: 20
  min_delta: 1.0e-5

# Both learned scores: (mean V)^(1/d) + lambda_miss * miss + lambda_cov * coverage penalty,
# threshold tau fixed, Adam with gradient clipping, checkpoint chosen every few epochs by
# calibrated validation coverage and size. The epoch cap is per method (icnn / spline below).
score_learning:
  tau: 1.0
  kappa_cov: 10.0                        # coverage temperature T = 1 / kappa_cov = 0.1
  gamma_miss: [0.01, 0.03, 1, 10]        # lambda_miss = gamma_miss * lambda_miss_ref (reference scale of the
  gamma_cov: [0, 0.1, 1]                 # lambda_cov  = gamma_cov  * lambda_cov_ref   initialised model)
  patience: 80
  grad_clip_norm: 5.0
  coverage_tolerance: 0.02               # epsilon. Admissible: checkpoints with coverage >= 1 - alpha - eps;
                                         # loss weights and tuning with |coverage - (1 - alpha)| <= eps
  checkpoint_every: 5
  min_selection_epoch: 10

# Per-(dataset, seed) tuning at the neutral weights (gamma 1, 1). The selection is saved in
# <output-dir>/tuning and reused. A one-element grid is not searched.
tuning:
  icnn:
    learning_rate: [0.002]
    batch_size: [32]
    encoder_hidden_dims: [[64, 32], [256, 128]]
  spline:
    num_knots: [2, 4, 6, 8]              # K linear segments per coordinate and sign
    learning_rate: [0.002]
    batch_size: [32, 64, 128]
    encoder_hidden_dims: [[64, 32], [256, 128]]

icnn:
  max_epochs: 400
  encoder_hidden_dims: [64, 32]          # starting point of the tuner (ReLU encoder on [x, F(x)])
  hidden_dim: 64                         # convex body: depth softplus layers of this width
  depth: 2
  strong_convexity: 0.001
  train_area_directions: 512             # d = 2: angles of the area quadrature, M_train = 2^9
  eval_area_directions: 2048             #        and for validation, M_valid = 2^11
  train_volume_directions: 512           # d > 2: Sobol directions, M_train = 2^9
  eval_volume_directions: 4096           #        and for validation, M_valid = 2^12
  whiten:                                # d > 2: direction whitening during training
    momentum: 0.05
    shrink: 0.05
    warmup_steps: 20
  root_finding:                          # d = 1 one-sided roots
    initial_bracket: 1.0
    bracket_growth: 2.0
    max_bracket_expansions: 40
    bisection_tol: 1.0e-6
    bisection_max_iter: 100
  set_boundary:                          # rays at d >= 2
    initial_radius: 1.0
    bracket_growth: 2.0
    max_radius: 1.0e+4
    tolerance: 1.0e-5
    bisection_steps: 60
  test_volume:                           # test-set volume (GPU)
    rounds: 24
    refine_directions: 2048
    budget_by_dim: {1: 16384, default: 32768}   # M = 2^15. V(M) and V(2M) come from one pass; the reported volume
                                                # is V(2M), i.e. 2^16 directions. At d = 1 the region is an interval:
                                                # the rays are +1 and -1 only, so the result is its exact length
                                                # (to the root-finding tolerance) at any budget
    convergence_tolerance: 0.001                # converged when |V(2M)^(1/d) / V(M)^(1/d) - 1| < 0.1%

spline:
  max_epochs: 300
  minimum_slope: 1.0e-4

# MVCS around F(x) (the inputs are already residuals), with the authors' hyperparameter grid (60
# candidates, selected by validation objective). `mvcs` keeps p >= 1 (convex); `mvcs_free` uses
# p = max(|p|, p_min).
mvcs:
  ridge: 1.0e-6
  p_init: 2.0
  p_min: 0.1
  max_epochs: 4000
  patience: 500
  grad_clip_norm: 5.0
  nonfinite_batch_tolerance: 0.05
  grid:
    hidden_dim: [256]
    n_layers: [3, 5]
    matrix_learning_rate: [0.0001, 0.001, 0.004, 0.005, 0.01]
    p_learning_rate: [0.001, 0.01]
    batch_size: [100, 200, 1000]

ellipsoid:
  covariance_ridge: 1.0e-6
  neighbor_fraction: 0.05                # K = max(2d + 5, ceil(0.05 n)), n = training rows of D_score
  local_weight: 0.95

empirical_copula:
  beta: 0.1
  log_epsilon: 1.0e-8
  normalizer:
    hidden_dims: [64, 32]
    epochs: 300
    batch_size: 256
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    patience: 25

locally_weighted:                        # univariate only
  rho_floor: 0.001

# PBS (AC-NQR_U): each configuration (width, depth, batch size) is trained; selection by the
# validation coverage error of the plug-in sets. Volume by change of variables at the largest budget.
pbs:
  configurations: [[10, 1, 2048], [12, 4, 512], [16, 4, 512], [46, 4, 8192], [18, 8, 256]]
  learning_rate: 0.01                    # potential and amortizer
  weight_decay: 1.0e-4
  grad_clip: 1.0
  max_epochs: 800
  amortizer_restart_epochs: 10
  newton_tol: 1.0e-5
  newton_max_iter: 60
  n_val_u: 32                            # reference draws per validation input
  alpha_init: 1.0                        # initial strong-convexity weight
  volume_budgets: [32768, 65536]         # the last one is reported

# Shared Monte Carlo volume estimator for the regions of every method but the ICNN and PBS
# (run.py --volume estimator). Same estimator as the ICNN's test volume; groups of 30 test points.
volume_estimator:
  reported_budget: 32768
  max_budget: 2097152                    # doubling stops here if the tolerance is never met
  tolerance_pct: 0.1                     # |(V(2M)/V(M))^(1/d) - 1| in percent
  rounds: 24
  refine_directions: 2048

# Synthetic shapes (synthetic.py): data sizes, seeds and the settings that differ from the
# real-data runs. The point predictor is the exact mean, so no MLP is fitted.
synthetic:
  seeds: [42, 43, 44, 45, 46]
  n_train: 2500
  n_val: 2000
  n_cal: 8000
  n_test: 1000
  gamma_cov: [0, 0.1]                    # in place of score_learning.gamma_cov
  icnn:                                  # fixed, not tuned
    learning_rate: 0.002
    batch_size: 32
    encoder_hidden_dims: [64, 32]
  threads: 8                             # torch threads (icnn: 4)
  iou_grid: 500                          # IoU on a 500 x 500 residual grid ...
  iou_inputs: 25                         # ... averaged over x = (0, 0) and 24 random inputs
