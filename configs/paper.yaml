# The paper's protocol. Every number in the tables was produced with these settings.

alpha: 0.10                     # target coverage 1 - alpha = 0.90
seeds: [0, 1, 2, 3, 4]
row_sample_seed: 20260819       # row cap sample seed = row_sample_seed + seed

splitting:                      # D_pred / D_score / D_cal / D_test, one seeded permutation
  pred_frac: 0.25
  score_frac: 0.30
  cal_frac: 0.25
  test_frac: 0.20
  pred_val_frac: 0.15           # internal validation split of D_pred (point predictor)
  score_val_frac: 0.20          # internal validation split of D_score (learned scores)

# Frozen point predictor F(x): one MLP per (dataset, seed), fit on the CPU with 4 threads and
# shared by every method. reference/point_predictors/ holds the paper's fitted predictors.
point_predictor:
  hidden_dims: [64, 32]
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 200
  patience: 20
  min_delta: 1.0e-5

# Training of both learned scores (CoCoNet_ICNN and CoCoNet_Spline).
score_learning:
  loss:
    size_objective: root_mean_volume     # (E[V])^(1/d)
    train_tau_mode: fixed                # threshold tau = 1 during training
    train_tau_fixed: 1.0
    score_space_miss_form: relative_relu # miss term mean[(S - tau)_+ / tau]
    kappa_miss: 10.0
    beta: 10.0                           # coverage sigmoid sharpness kappa_cov
    lambda_l2: 0.0
  gamma_grid_miss: [0.01, 0.03, 1, 10]   # lambda_miss = gamma_miss * lambda_miss_ref
  gamma_grid_cov: [0, 0.1, 1]            # lambda_cov  = gamma_cov  * lambda_cov_ref
  lambda_fallback_rule: undercoverage_gamma_distance
  max_epochs: 400
  patience: 80
  grad_clip_norm: 5.0
  epsilon: 0.001
  coverage_tolerance: 0.02
  checkpoint_selection_metric: calibrated_validation_area
  checkpoint_every: 5
  min_selection_epoch: 10
  optimizer: adam

# Per-(dataset, seed) tuning of the optimizer settings, at the neutral weights (gamma 1, 1).
# reference/tuning/{icnn,spline}/ holds the paper's selections.
tuning:
  icnn:                                  # coordinate descent lr -> batch -> encoder -> eps
    learning_rate: [0.002]
    batch_size: [32]
    patience: 80
    encoder_hidden_dims: [[64, 32], [256, 128]]
    strong_convexity: [0.001]
  spline:                                # knots -> lr -> batch -> encoder
    num_knots: [2, 4, 6, 8]
    learning_rate: [0.002]
    batch_size: [32, 64, 128]
    patience: 80
    encoder_hidden_dims: [[64, 32], [256, 128]]

icnn:
  encoder_hidden_dims: [64, 32]          # replaced by the tuned selection
  icnn_hidden_dim: 64
  icnn_depth: 2                          # body [64, 64]
  activation: softplus
  encoder_activation: relu
  strong_convexity: 0.001
  train_area_directions: 512             # d = 2 area quadrature during training
  eval_area_directions: 2048             # d = 2 area quadrature for validation
  train_volume_directions: 512           # d > 2 QMC directions during training
  eval_volume_directions: 4096           # d > 2 QMC directions for validation
  volume_whiten: true
  whiten_momentum: 0.05
  whiten_shrink: 0.05
  whiten_warmup_steps: 20
  root_finding:
    initial_bracket: 1.0
    bracket_growth: 2.0
    max_bracket_expansions: 40
    bisection_tol: 1.0e-6
    bisection_max_iter: 100
  set_boundary:
    initial_radius: 1.0
    bracket_growth: 2.0
    max_radius: 1.0e+4
    tolerance: 1.0e-5
    bisection_steps: 60
  test_volume:                           # converged test-set volume (GPU)
    rounds: 24
    refine_directions: 2048
    budget_by_dim: {1: 16384, default: 32768}   # V(M) and V(2M) in one pass; V(2M) is reported
    convergence_tolerance: 0.001         # |V(2M)^(1/d) / V(M)^(1/d) - 1| below this = converged

spline:
  encoder_hidden_dims: [64, 32]          # replaced by the tuned selection
  num_knots: 2                           # replaced by the tuned selection
  epsilon: 0.001
  transformation_lr_multiplier: 1.0

# MVCS_conv: fixed-centre convex MVCS with the authors' hyperparameter grid.
mvcs:
  ridge: 1.0e-6
  p_init: 2.0
  p_min: 0.1
  order_statistic_convention: target_coverage
  average_volume_term: false
  max_epochs: 4000
  patience: 500
  grad_clip_norm: 5.0
  checkpoint_every: 1
  inner_calibration_frac: 0.5
  nonfinite_batch_tolerance: 0.05
  grid:                                  # 60 candidates, min validation objective
    hidden_dim: [256]
    n_layers: [3, 5]
    matrix_learning_rate: [0.0001, 0.001, 0.004, 0.005, 0.01]
    p_learning_rate: [0.001, 0.01]
    batch_size: [100, 200, 1000]

ellipsoid:
  covariance_ridge: 1.0e-6
  neighbor_fraction: 0.05                # K = max(2d + 5, ceil(0.05 n_score))
  local_weight: 0.95
  distance_metric: euclidean
  standardize_context: true

empirical_copula:
  beta: 0.1
  log_epsilon: 1.0e-8
  normalizer_hidden_dims: [64, 32]
  normalizer_epochs: 300
  normalizer_batch_size: 256
  normalizer_learning_rate: 1.0e-3
  normalizer_weight_decay: 1.0e-4
  normalizer_patience: 25

locally_weighted_conformal:              # LW-SC (univariate only)
  rho_floor: 0.001
