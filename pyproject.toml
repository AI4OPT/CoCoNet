[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learnscore-tau1"
version = "0.1.0"
description = "An ICNN-learned conformity score for multivariate conformal prediction (tau1 loss, split conformal calibration)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["learnscore", "learnscore.datasets"]
